<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Funeraria Eterna Memoria 🕊️</title>
    <script src="04_eventos_mp.js" defer></script>
</head>
<body>
    <h2>⚱️ Bienvenido a la Funeraria "Eterna Memoria"</h2>

    <div id="contenedor"></div>

    <button id="crear">Crear mensaje</button>
    <button id="eliminar">Eliminar mensaje</button>

    <button onclick="alert('Gracias por confiar en Eterna Memoria 🕯️')">
        Mensaje directo
    </button>

    <button onclick="saludar()">
        Saludar desde la función
    </button>

    <p id="parrafo">Haga doble clic para un mensaje conmemorativo</p>

    <form id="formulario" style="margin-top:20px;">
        <input type="text" id="nombre" placeholder="Ingrese el nombre del ser querido 🕊️" />
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
